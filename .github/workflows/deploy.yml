name: Deploy to GitHub Pages

on:
  # mainブランチへのpushで実行
  push:
    branches:
      - main

  # PRがmainブランチにマージされたときに実行
  pull_request:
    branches:
      - main
    types:
      - closed

  # 手動実行も可能にする
  workflow_dispatch:

# GitHub Pagesへのデプロイに必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に実行されるデプロイを1つに制限
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ビルドジョブ（静的サイトなのでビルドは不要だが、構造として残す）
  build:
    runs-on: ubuntu-latest

    # PRがマージされた場合のみ実行
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # デプロイするディレクトリを指定（ルートディレクトリ全体）
          path: '.'

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
